name: Ansible Deploy Java

on:
  push:
    branches: [master]
    paths:
      - 'ansible/vars/app_java.yml'
      - 'ansible/playbooks/deploy_java.yml'
      - 'ansible/roles/web_app/**'
      - '.github/workflows/ansible-deploy-java.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ansible/**'
      - '!ansible/docs/**'
      - '.github/workflows/ansible-deploy-java.yml'

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ansible ansible-lint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
        working-directory: ansible

      - name: Create dummy vault password for lint
        run: echo "dummy" > ansible/.vault_pass

      - name: Run ansible-lint
        run: ansible-lint playbooks/*.yml
        working-directory: ansible

      - name: Cleanup dummy vault pass
        if: always()
        run: rm -f ansible/.vault_pass

  deploy:
    name: Deploy Java App
    needs: lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          cat <<'EOF' > ~/.ssh/id_ed25519
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create vault password file
        run: |
          cat <<'EOF' > ansible/.vault_pass
          ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          EOF
          chmod 600 ansible/.vault_pass

      - name: Verify SSH access
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            yc-user@${{ secrets.VM_HOST }} true

      - name: Run Ansible playbook
        run: |
          ansible-playbook playbooks/deploy_java.yml \
            -i inventory/hosts.ini \
            -e "ansible_host=${{ secrets.VM_HOST }}" \
            -e "ansible_ssh_private_key_file=/home/runner/.ssh/id_ed25519"
        working-directory: ansible

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://${{ secrets.VM_HOST }}:5001/health

      - name: Cleanup
        if: always()
        run: rm -f ansible/.vault_pass
