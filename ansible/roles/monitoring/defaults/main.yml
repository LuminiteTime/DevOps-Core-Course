---
monitoring_dir: /opt/monitoring

monitoring_loki_version: "3.0.0"
monitoring_promtail_version: "3.0.0"
monitoring_grafana_version: "12.3.1"
monitoring_prometheus_version: "3.9.0"

monitoring_loki_port: 3100
monitoring_grafana_port: 3000
monitoring_promtail_port: 9080
monitoring_prometheus_port: 9090

monitoring_loki_retention_period: "168h"
monitoring_loki_schema_version: "v13"
monitoring_prometheus_retention_days: 15
monitoring_prometheus_retention_size: "10GB"
monitoring_prometheus_scrape_interval: "15s"

monitoring_grafana_admin_user: admin
monitoring_grafana_admin_password: "{{ vault_grafana_admin_password | default('admin') }}"

monitoring_prometheus_targets:
  - job: prometheus
    targets:
      - "localhost:9090"
  - job: loki
    targets:
      - "loki:3100"
  - job: grafana
    targets:
      - "grafana:3000"
  - job: app
    targets:
      - "host.docker.internal:5000"
    path: /metrics

monitoring_loki_cpu_limit: "1.0"
monitoring_loki_memory_limit: "1G"
monitoring_loki_cpu_reservation: "0.25"
monitoring_loki_memory_reservation: "256M"

monitoring_promtail_cpu_limit: "0.5"
monitoring_promtail_memory_limit: "512M"
monitoring_promtail_cpu_reservation: "0.1"
monitoring_promtail_memory_reservation: "128M"

monitoring_grafana_cpu_limit: "1.0"
monitoring_grafana_memory_limit: "1G"
monitoring_grafana_cpu_reservation: "0.25"
monitoring_grafana_memory_reservation: "256M"

monitoring_prometheus_cpu_limit: "1.0"
monitoring_prometheus_memory_limit: "1G"
monitoring_prometheus_cpu_reservation: "0.25"
monitoring_prometheus_memory_reservation: "256M"
