apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "devops-info.fullname" . }}-post-install"
  labels:
    {{- include "devops-info.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "devops-info.fullname" . }}-post-install"
    spec:
      restartPolicy: Never
      containers:
        - name: post-install-smoke
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "=== Post-install smoke test ==="
              echo "Waiting for service to become reachable..."
              sleep 5
              echo "Attempting health check via service DNS..."
              wget -qO- --timeout=10 http://{{ include "devops-info.fullname" . }}:{{ .Values.service.port }}/health || echo "Service not ready yet (expected during initial rollout)"
              echo "Post-install smoke test finished"
