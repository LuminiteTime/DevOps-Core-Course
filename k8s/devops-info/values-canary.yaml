replicaCount: 3

workload:
  kind: Rollout

image:
  tag: "lab12"

env:
  APP_NAME: devops-info-service
  APP_DESCRIPTION: Canary rollout release
  APP_VERSION: 1.0.0-canary
  APP_VARIANT: canary

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

rollout:
  strategy:
    type: canary
    blueGreen:
      autoPromotionEnabled: false
  analysis:
    enabled: false
    path: /health
