replicaCount: 5

image:
  tag: "1.0.0"

env:
  APP_NAME: devops-info-service
  APP_DESCRIPTION: Production environment
  APP_VERSION: 1.0.0
  APP_VARIANT: production

service:
  type: LoadBalancer
  port: 80

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 3
  timeoutSeconds: 2
  failureThreshold: 3
