replicaCount: 3

workload:
  kind: StatefulSet

image:
  tag: "lab12"

env:
  APP_NAME: devops-info-service
  APP_DESCRIPTION: StatefulSet with monitoring and init containers
  APP_VERSION: 1.3.0-monitoring
  APP_VARIANT: statefulset

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

statefulset:
  updateStrategy:
    type: RollingUpdate
    partition: null

initContainers:
  enabled: true
  image: busybox:1.36
  waitForService: kubernetes.default.svc.cluster.local
  downloadUrl: https://example.com
  sharedMountPath: /init-data

serviceMonitor:
  enabled: true
  releaseLabel: monitoring
  path: /metrics
  interval: 15s
