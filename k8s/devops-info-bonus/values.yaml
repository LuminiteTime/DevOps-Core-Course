replicaCount: 2

image:
  repository: luminitetime/devops-info-service-python
  tag: "lab09"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

env:
  APP_NAME: devops-info-service-bonus
  APP_DESCRIPTION: Bonus app managed by Helm
  APP_VERSION: 2.0.0-helm
  APP_VARIANT: bonus

podAnnotations: {}

securityContext:
  seccompProfile:
    type: RuntimeDefault
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30081

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

revisionHistoryLimit: 5
minReadySeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
