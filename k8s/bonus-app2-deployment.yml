apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-info-bonus
  namespace: devops-lab09
  labels:
    app.kubernetes.io/name: devops-info-bonus
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: devops-info-platform
    course.lab: lab09
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-info-bonus
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-info-bonus
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: devops-info-platform
        app.kubernetes.io/version: v1
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: devops-info-bonus
          image: luminitetime/devops-info-service-python:lab09
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_NAME
              value: devops-info-service-bonus
            - name: APP_DESCRIPTION
              value: Bonus ingress target for Lab 09
            - name: APP_VERSION
              value: 2.0.0-k8s
            - name: APP_VARIANT
              value: bonus
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
