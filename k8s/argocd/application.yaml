apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-info-default
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LuminiteTime/DevOps-Core-Course.git
    targetRevision: lab13
    path: k8s/devops-info
    helm:
      releaseName: lab13-devops
      valueFiles:
        - values.yaml
      parameters:
        - name: service.type
          value: ClusterIP
        - name: service.nodePort
          value: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
